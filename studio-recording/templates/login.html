{% extends "base.html" %}
{% block title %}Вход — Студия звукозаписи{% endblock %}
{% block content %}
<div class="login card">
  <div class="logo">Studio<b>Rec</b></div>
  <p class="sub">Вход в систему управления студией звукозаписи</p>
  <form method="post">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" required>
    <button class="btn" type="submit" style="width:100%">Войти</button>
  </form>
</div>
{% endblock %}
