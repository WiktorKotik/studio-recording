<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Студия звукозаписи{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if g.user %}
<nav class="nav">
  <a class="logo" href="{{ url_for('dashboard') }}">Studio<b>Rec</b></a>
  <a class="link {{ 'active' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">Панель</a>
  <a class="link {{ 'active' if request.endpoint in ('albums', 'album') }}" href="{{ url_for('albums') }}">Альбомы</a>
  <a class="link {{ 'active' if request.endpoint == 'schedule' }}" href="{{ url_for('schedule') }}">Расписание</a>
  <div class="who">{{ g.user.full_name }} · {{ g.user.role_title }}<a href="{{ url_for('logout') }}">Выйти</a></div>
</nav>
{% endif %}
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
